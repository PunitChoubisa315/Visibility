<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Ganesh Chaturthi Banner - Hariom Ghar Ghanti</title>
<style>
  body {
    margin: 0;
    padding: 40px;
    background: #fdf6ec;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
  }

  .banner {
    background: linear-gradient(135deg, #ff9933, #ffcc66);
    border: 4px solid #b30000;
    border-radius: 16px;
    padding: 30px 40px;
    max-width: 600px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

  .emoji {
    font-size: 48px;
    margin-bottom: 10px;
  }

  .title {
    font-size: 28px;
    font-weight: bold;
    color: #7a0000;
    margin: 10px 0;
  }

  .shop-name {
    font-size: 20px;
    font-weight: bold;
    color: #b30000;
    margin: 15px 0 5px;
  }

  .message {
    font-size: 17px;
    color: #333;
    line-height: 1.6;
    margin-top: 10px;
  }

  .footer {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #7a0000;
  }
</style>
</head>
<body>

<div class="banner">
  <div class="emoji">🙏🐘</div>
  <div class="title">गणेश चतुर्थी की हार्दिक शुभकामनाएं!</div>

  <div class="shop-name">हरिओम घर घंटी की तरफ से</div>

  <div class="message">
    आप सभी को गणेश चतुर्थी की हार्दिक शुभकामनाएं।<br>
    बप्पा आपके जीवन में सुख, समृद्धि और खुशहाली लाएं।
  </div>

  <div class="footer">गणपति बप्पा मोरया! 🙏</div>
</div>

</body>
</html>
